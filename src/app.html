<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<!-- Apply the saved mode before the first paint (darksite's MODE_SCRIPT). -->
		<script>
			try {
				var m = localStorage.getItem('darksite:mode');
				if (m && m !== 'system') document.documentElement.setAttribute('data-ds-theme', m);
				var b = localStorage.getItem('darksite-gallery:brand');
				if (b) document.documentElement.setAttribute('data-brand', b);
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
