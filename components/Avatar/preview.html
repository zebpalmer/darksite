<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite · Avatar</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');
.demo{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--ds-bg-1);font-family:var(--font-sans);color:var(--ds-text-1)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cap{font-size:var(--ds-text-xs);line-height:var(--ds-lh-xs);color:var(--ds-text-3)}
.a{display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border-radius:var(--ds-radius-full);border:1px solid var(--ds-border);background:var(--ds-bg-4);color:var(--ds-text-2);font-weight:500;line-height:1}
.a.square{border-radius:var(--ds-radius-sm);font-family:var(--font-mono);color:var(--ds-text-1)}
.s24{width:24px;height:24px;font-size:12px}
.s32{width:32px;height:32px;font-size:12px}
.s56{width:56px;height:56px;font-size:14px}
.s72{width:72px;height:72px;font-size:14px}
.a img{width:100%;height:100%;object-fit:cover;display:block}
</style>
<div class="demo">
  <div class="row">
    <span class="a s24">AR</span><span class="a s32">AR</span><span class="a s56">AR</span><span class="a s72">ML</span>
    <span class="a square s32">SA</span><span class="a square s56">SA</span>
    <span class="a s56"><svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="var(--color-surface-600)"/><circle cx="28" cy="21" r="10" fill="var(--color-surface-400)"/><path d="M8 56c2-12 10-18 20-18s18 6 20 18z" fill="var(--color-surface-400)"/></svg></span>
  </div>
  <div class="cap">round for people, square (radius-sm, mono initials) for organizations · 24 / 32 / 56 / 72, the font stepping up at 48 · an image fills with object-fit: cover, and a load failure falls back to initials</div>
</div>
</body>
</html>
