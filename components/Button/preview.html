<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite · Button</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
.demo{display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--ds-bg-1);font-family:var(--font-sans);color:var(--ds-text-1)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap{font-size:var(--ds-text-xs);line-height:var(--ds-lh-xs);color:var(--ds-text-3)}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;height:var(--ds-h-default);padding:0 12px;border:1px solid transparent;border-radius:var(--ds-radius-sm);background:transparent;color:var(--ds-text-1);font-family:var(--font-sans);font-size:var(--ds-text-sm);line-height:var(--ds-lh-sm);font-weight:400;white-space:nowrap}
.b.dense{height:var(--ds-h-dense);padding:0 10px;gap:6px}
.b.comfy{height:var(--ds-h-comfy);padding:0 14px}
.b.touch{height:var(--ds-h-touch);padding:0 16px;font-size:var(--ds-text-md)}
.b.primary{background:var(--ds-accent);color:var(--ds-accent-contrast);font-weight:500}
.b.secondary{background:var(--ds-bg-4);border-color:var(--ds-border-strong)}
.b.ghost{color:var(--ds-text-2)}
.b.hover{background:var(--ds-bg-4);color:var(--ds-text-1)}
.b.danger{color:var(--ds-danger-text)}
.b.dangersolid{background:var(--ds-danger);color:var(--ds-danger-contrast);font-weight:500}
.b.icon{width:var(--ds-h-default);padding:0;color:var(--ds-text-2)}
.b.off{opacity:.45}
.b.focus{outline:2px solid var(--ds-focus);outline-offset:2px}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--ds-border-strong);border-bottom-width:2px;border-radius:var(--ds-radius-xs);background:var(--ds-bg-2);color:var(--ds-text-2);font-family:var(--font-mono);font-size:var(--ds-text-xs);line-height:1}
.b.primary kbd{background:var(--ds-accent-key);border-color:var(--ds-accent-key-edge);color:var(--ds-accent-contrast)}
svg{flex:none}
</style>
<div class="demo">
  <div class="row">
    <span class="b ghost">Play<kbd>Space</kbd></span>
    <span class="b secondary">Accept all</span>
    <span class="b primary">Save<kbd>Enter</kbd></span>
    <span class="b danger">Delete</span>
    <span class="b dangersolid">Delete 12 records</span>
  </div>
  <div class="cap">primary · secondary · ghost · danger · danger-solid (Dialog confirm only)</div>
  <div class="row">
    <span class="b icon" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
    <span class="b icon hover" title="Repeat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>
    <span class="b secondary focus">Focused</span>
    <span class="b secondary off">Disabled</span>
    <span class="b secondary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-dasharray="44" stroke-dashoffset="12"/></svg>Saving</span>
  </div>
  <div class="cap">icon (label required) · hover · focus-visible · disabled 45% · loading</div>
  <div class="row">
    <span class="b dense secondary">dense 28</span>
    <span class="b secondary">default 32</span>
    <span class="b comfy secondary">comfy 36</span>
    <span class="b touch secondary">touch 44</span>
  </div>
</div>
</body>
</html>
