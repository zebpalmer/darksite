<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite · Spinner</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
.demo{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--ds-bg-1);font-family:var(--font-sans);color:var(--ds-text-1)}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cap{font-size:var(--ds-text-xs);line-height:var(--ds-lh-xs);color:var(--ds-text-3)}
.sp{display:inline-flex;flex:none;color:var(--ds-text-2)}
.sp svg{animation:ds-spin .9s linear infinite}
@keyframes ds-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp svg{animation:none}}
.more{display:inline-flex;align-items:center;gap:8px;font-size:var(--ds-text-sm);color:var(--ds-text-3)}
.b{display:inline-flex;align-items:center;gap:8px;height:var(--ds-h-default);padding:0 12px;border-radius:var(--ds-radius-sm);background:var(--ds-accent);color:var(--ds-accent-contrast);font-size:var(--ds-text-sm);font-weight:500}
.b.sec{background:var(--ds-bg-4);border:1px solid var(--ds-border-strong);color:var(--ds-text-1);font-weight:400}
svg{flex:none}
</style>
<div class="demo">
  <div class="row">
    <span class="sp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>
    <span class="more"><span class="sp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>Loading more…</span>
    <span class="b"><span class="sp" style="color:currentColor"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>Saving</span>
    <span class="b sec"><span class="sp" style="color:currentColor"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span>Retrying</span>
  </div>
  <div class="cap">bare · "Loading more…" · inside Button loading with a loadingLabel. Static under prefers-reduced-motion.</div>
</div>
</body>
</html>
