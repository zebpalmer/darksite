<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite · Tabs</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
.demo{display:flex;flex-direction:column;gap:14px;padding:18px 0;background:var(--ds-bg-1);font-family:var(--font-sans);color:var(--ds-text-1)}
.pad{padding:0 18px}
.cap{font-size:var(--ds-text-xs);line-height:var(--ds-lh-xs);color:var(--ds-text-3);padding:0 18px}
.tabs{display:flex;align-items:stretch;gap:4px;border-bottom:1px solid var(--ds-border-subtle);padding:0 18px}
.tabs t{position:relative;display:inline-flex;align-items:center;gap:6px;flex:none;height:40px;padding:0 10px;color:var(--ds-text-2);font-size:var(--ds-text-sm);line-height:var(--ds-lh-sm);white-space:nowrap;border-radius:var(--ds-radius-sm) var(--ds-radius-sm) 0 0}
.tabs t.on{color:var(--ds-text-1)}
.tabs t.on::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--ds-accent)}
.tabs t.off{opacity:.45}
.count{font-size:var(--ds-text-xs);color:var(--ds-text-3);font-variant-numeric:tabular-nums}
.count.danger{color:var(--ds-danger-text)}
.count.warning{color:var(--ds-warning-text)}
.pill{display:inline-flex;gap:2px;padding:2px;border-radius:var(--ds-radius-md);border:1px solid var(--ds-border-subtle);background:var(--ds-bg-2)}
.pill t{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--ds-radius-sm);color:var(--ds-text-3);font-size:var(--ds-text-sm);white-space:nowrap}
.pill t.on{background:var(--ds-bg-4);color:var(--ds-text-1)}
</style>
<div class="demo">
  <div class="tabs"><t class="on">Queue<span class="count">128</span></t><t>Needs severity<span class="count warning">7</span></t><t>In progress<span class="count">24</span></t><t>Failed<span class="count danger">3</span></t><t class="off">Archived</t></div>
  <div class="cap">underline: active is text-1 over a 2px accent rule; tone colors the count only</div>
  <div class="pad"><span class="pill"><t class="on">Card<span class="count">1</span></t><t>Bulk<span class="count">12</span></t><t>History</t></span></div>
  <div class="cap">variant="pill": the segmented look for a dense work header — 28px, 40 on touch</div>
</div>
</body>
</html>
