<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite · NewBadge</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
.demo{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--ds-bg-1);font-family:var(--font-sans);color:var(--ds-text-1)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap{font-size:var(--ds-text-xs);line-height:var(--ds-lh-xs);color:var(--ds-text-3)}
.new{display:inline-flex;align-items:center;flex:none;height:16px;padding:0 5px;border:1px solid var(--ds-accent);border-radius:var(--ds-radius-xs);color:var(--ds-accent-text);font-size:var(--ds-text-xs);line-height:1;white-space:nowrap}
.c{display:inline-flex;align-items:center;gap:6px;height:var(--ds-h-dense);padding:0 8px;border:1px dashed var(--ds-accent);border-radius:var(--ds-radius-sm);background:transparent;color:var(--ds-text-2);font-size:var(--ds-text-sm)}
.c.plain{border-color:var(--ds-border-strong)}
svg{flex:none}
</style>
<div class="demo">
  <div class="row"><span class="new">new</span></div>
  <div class="row">
    <span class="c"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Half-light<span class="new">new</span></span>
    <span class="c plain"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Urgent</span>
  </div>
  <div class="cap">left: Chip isNew — the dashed border takes the accent too. right: an ordinary suggestion for a label that already exists.</div>
</div>
</body>
</html>
