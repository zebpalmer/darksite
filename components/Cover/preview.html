<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
.cover{position:relative;width:960px;height:300px;background:var(--ds-bg-1);overflow:hidden}
.cover svg{display:block}
.name{position:absolute;left:40px;bottom:58px;margin:0;font-family:var(--font-sans);font-size:88px;line-height:.95;font-weight:500;letter-spacing:-.02em;color:var(--ds-text-1)}
.tag{position:absolute;left:40px;bottom:30px;margin:0;max-width:440px;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ds-text-3)}
.s1{fill:var(--ds-sev-info)}.s2{fill:var(--ds-sev-low)}.s3{fill:var(--ds-sev-medium)}
.s4{fill:var(--ds-sev-high)}.s5{fill:var(--ds-sev-critical)}
.band{rx:var(--ds-radius-sm)}
.tile{rx:var(--ds-radius-sm)}
.slab{rx:var(--ds-radius-md);fill:var(--color-primary-500)}
.ink{fill:var(--color-surface-950)}
.deep{fill:var(--color-surface-700)}
.mid{fill:var(--color-surface-600)}
.light{fill:var(--color-surface-500)}
.tint{fill:var(--color-primary-200)}
.shade{fill:var(--color-primary-700)}
</style>
<!--
  blocks: the five ds-sev-* marks at full value as a top band of unequal widths, color-primary-500
    as a tall slab, and color-surface-950/700/600/500 with one color-primary-200 tint as the tile
    field — together about a third of the cover.
  arrangement: a strip of unequal bands over a modular tile field, both inside one box right of
    x=480; nothing crosses the name or the tagline.
  pattern: tiles cut by the radius tokens, some merged two-wide — chosen because this is a dense,
    modular system on a 4px grid whose ordered scale is literally a strip of marked bands; the
    pattern is that grid and that strip, not a motif.
  scales: gaps 4px (ds-space-1), tile 36px, band height 96px, radii ds-radius-sm 6px on the bands
    and tiles, ds-radius-md 8px on the slab.
-->
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="band s1" x="504" y="36" width="68" height="96"/>
    <rect class="band s2" x="576" y="36" width="76" height="96"/>
    <rect class="band s3" x="656" y="36" width="84" height="96"/>
    <rect class="band s4" x="744" y="36" width="88" height="96"/>
    <rect class="band s5" x="836" y="36" width="76" height="96"/>

    <rect class="slab" x="504" y="146" width="120" height="116"/>

    <rect class="tile deep"  x="636" y="146" width="76" height="36"/>
    <rect class="tile light" x="716" y="146" width="36" height="36"/>
    <rect class="tile ink"   x="756" y="146" width="36" height="36"/>
    <rect class="tile tint"  x="796" y="146" width="76" height="36"/>
    <rect class="tile mid"   x="876" y="146" width="36" height="36"/>

    <rect class="tile ink"   x="636" y="186" width="36" height="36"/>
    <rect class="tile shade" x="676" y="186" width="76" height="36"/>
    <rect class="tile mid"   x="756" y="186" width="36" height="36"/>
    <rect class="tile deep"  x="796" y="186" width="36" height="36"/>
    <rect class="tile light" x="836" y="186" width="76" height="36"/>

    <rect class="tile mid"   x="636" y="226" width="76" height="36"/>
    <rect class="tile ink"   x="716" y="226" width="36" height="36"/>
    <rect class="tile deep"  x="756" y="226" width="76" height="36"/>
    <rect class="tile light" x="836" y="226" width="36" height="36"/>
    <rect class="tile deep"  x="876" y="226" width="36" height="36"/>
  </svg>
  <p class="name">darksite</p>
  <p class="tag">Dense, keyboard-first and dark by default, for operator software.</p>
</div>
</body>
</html>
