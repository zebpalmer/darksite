<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darksite · JustifiedGrid</title>
<link rel="stylesheet" href="../../src/lib/tokens.css">
<style>html,body{margin:0;background:var(--ds-bg-1);color:var(--ds-text-1);font-family:var(--font-sans)}</style>
<script>if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.dataset.theme='light'</script>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');
.demo{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--ds-bg-1);font-family:var(--font-sans);color:var(--ds-text-1)}
.cap{font-size:var(--ds-text-xs);line-height:var(--ds-lh-xs);color:var(--ds-text-3)}
.jgrid{display:flex;flex-direction:column;gap:6px;width:100%}
.jrow{display:flex;gap:6px}
.jtile{position:relative;flex:none;overflow:hidden;border-radius:var(--ds-radius-sm);background:var(--ds-bg-3)}
.jtile svg{width:100%;height:100%;display:block}
</style>
<div class="demo">
  <div class="jgrid">
    <div class="jrow" style="height:96px">
      <div class="jtile" style="width:144px;height:96px"><svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true"><rect width="3" height="2" fill="var(--color-surface-600)"/></svg></div>
      <div class="jtile" style="width:64px;height:96px"><svg viewBox="0 0 2 3" preserveAspectRatio="none" aria-hidden="true"><rect width="2" height="3" fill="var(--color-surface-700)"/></svg></div>
      <div class="jtile" style="width:96px;height:96px"><svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><rect width="1" height="1" fill="var(--color-surface-500)"/></svg></div>
      <div class="jtile" style="width:171px;height:96px"><svg viewBox="0 0 16 9" preserveAspectRatio="none" aria-hidden="true"><rect width="16" height="9" fill="var(--color-surface-750)"/></svg></div>
    </div>
    <div class="jrow" style="height:112px">
      <div class="jtile" style="width:75px;height:112px"><svg viewBox="0 0 2 3" preserveAspectRatio="none" aria-hidden="true"><rect width="2" height="3" fill="var(--color-surface-500)"/></svg></div>
      <div class="jtile" style="width:249px;height:112px"><svg viewBox="0 0 20 9" preserveAspectRatio="none" aria-hidden="true"><rect width="20" height="9" fill="var(--color-surface-600)"/></svg></div>
      <div class="jtile" style="width:112px;height:112px"><svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><rect width="1" height="1" fill="var(--color-surface-700)"/></svg></div>
    </div>
    <div class="jrow" style="height:96px">
      <div class="jtile" style="width:144px;height:96px"><svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true"><rect width="3" height="2" fill="var(--color-surface-700)"/></svg></div>
      <div class="jtile" style="width:64px;height:96px"><svg viewBox="0 0 2 3" preserveAspectRatio="none" aria-hidden="true"><rect width="2" height="3" fill="var(--color-surface-600)"/></svg></div>
    </div>
  </div>
  <div class="cap">each row is scaled to fill the width exactly, so row heights differ; nothing is cropped. The last row keeps the target height, left-aligned — it is never stretched.</div>
</div>
</body>
</html>
